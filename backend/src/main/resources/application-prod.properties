# Production profile overrides - loaded on top of application.properties when
# SPRING_PROFILES_ACTIVE=prod (set this in Render environment variables).
#
# These settings make the backend safer and quieter in production:
#   - ddl-auto=validate   Hibernate NEVER modifies the schema; only checks it matches.
#                         Prevents accidental data loss if a model field is wrong.
#   - show-sql=false      Stops printing every SQL query to logs.
#   - format_sql=false    No multi-line SQL formatting in logs.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
