spring.application.name=EventHora-Backend

# ─── Active Profile ────────────────────────────────────────────────────────────
# Local dev:  leave SPRING_PROFILES_ACTIVE unset → defaults to "dev"
# Render:     set SPRING_PROFILES_ACTIVE=prod → also loads application-prod.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Database ─────────────────────────────────────────────────────────────────
# Local dev:  leave DATABASE_URL unset → falls back to localhost:5434
# Render:     set DATABASE_URL to the full JDBC URL from Neon.tech
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/eventhora}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Redis ────────────────────────────────────────────────────────────────────
# Local dev:  defaults to localhost:6379, no password, no SSL
# Render:     set REDIS_HOST, REDIS_PORT, REDIS_PASSWORD from Upstash + REDIS_SSL=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# ─── AWS S3 ───────────────────────────────────────────────────────────────────
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.bucket.name=${S3_BUCKET_NAME}

# ─── Multipart ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Razorpay ─────────────────────────────────────────────────────────────────
# Get from dashboard.razorpay.com > Settings > API Keys
# Use rzp_test_... during resume/demo phase; switch to rzp_live_... for RIC production
razorpay.api.key=${RAZORPAY_KEY_ID}
razorpay.api.secret=${RAZORPAY_KEY_SECRET}

# Razorpay Webhook Secret — set from dashboard.razorpay.com > Settings > Webhooks
# This is a DIFFERENT secret from the API secret above.
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Local dev:  defaults to localhost origins
# Render:     set CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
#             For multiple origins use comma-separated values (no spaces):
#             e.g. CORS_ALLOWED_ORIGINS=https://eventhora.vercel.app,https://custom-domain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}

# ─── Demo Mode ────────────────────────────────────────────────────────────────
# When true, OTP "123456" is always accepted so visitors can test the booking flow.
# Set DEMO_MODE=true on Render during the resume/portfolio phase.
# Set DEMO_MODE=false when going live for RIC.
demo.mode=${DEMO_MODE:false}

# ─── Scheduler ────────────────────────────────────────────────────────────────
# Minutes after which a PENDING registration is expired to FAILED, freeing the seat.
# A Razorpay order is valid for 15 minutes by default; 30 is a safe buffer.
scheduler.pending-expiry.minutes=30
